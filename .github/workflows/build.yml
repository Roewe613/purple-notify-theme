name: Build Purple Theme Module
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: zulu, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - name: Build APK
        run: |
          yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" || true
          mkdir -p /tmp/xposed-stub/de/robv/android/xposed/callbacks app/libs
          printf 'package de.robv.android.xposed.callbacks; public final class XC_LoadPackage { public static class LoadPackageParam { public String packageName; public ClassLoader classLoader; } }' > /tmp/xposed-stub/de/robv/android/xposed/callbacks/XC_LoadPackage.java
          printf 'package de.robv.android.xposed; import de.robv.android.xposed.callbacks.XC_LoadPackage; public interface IXposedHookLoadPackage { void handleLoadPackage(XC_LoadPackage.LoadPackageParam p) throws Throwable; }' > /tmp/xposed-stub/de/robv/android/xposed/IXposedHookLoadPackage.java
          printf 'package de.robv.android.xposed; public abstract class XC_MethodHook { protected void afterHookedMethod(MethodHookParam p) throws Throwable {} public static class MethodHookParam { public Object thisObject; public Object[] args; } }' > /tmp/xposed-stub/de/robv/android/xposed/XC_MethodHook.java
          printf 'package de.robv.android.xposed; public final class XposedHelpers { public static Class<?> findClass(String n,ClassLoader l){return null;} public static void findAndHookMethod(Class<?> c,String n,Object... a){} }' > /tmp/xposed-stub/de/robv/android/xposed/XposedHelpers.java
          printf 'package de.robv.android.xposed; public final class XposedBridge { public static void log(String s){} }' > /tmp/xposed-stub/de/robv/android/xposed/XposedBridge.java
          javac -d /tmp/xposed-classes $(find /tmp/xposed-stub -name '*.java')
          jar cf app/libs/xposed-api-stub.jar -C /tmp/xposed-classes .
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip -O /tmp/g.zip
          unzip -q /tmp/g.zip -d /tmp
          /tmp/gradle-8.7/bin/gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: purple-notify-theme-apk
          path: app/build/outputs/apk/debug/*.apk
