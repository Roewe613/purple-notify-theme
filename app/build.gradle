plugins { id 'com.android.application' }

android {
    namespace 'com.minis.purplenotifytheme'
    compileSdk 35
    defaultConfig {
        applicationId 'com.minis.purplenotifytheme'
        minSdk 26
        targetSdk 35
        versionCode 15
        versionName '6.5-edgefix'
    }
}

dependencies {
    // 构建时由 GitHub Actions 生成仅编译用的 Xposed stub；不会打包进 APK。
    compileOnly files('libs/xposed-api-stub.jar')
}
